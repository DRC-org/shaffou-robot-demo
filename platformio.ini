; しゃっふぉうロボット 展示用ファームウェア
;   cwmc : 中央制御基板 (ESP32-DevKitC)  PS5 受信 / LCD / CAN 送信
;   dcmd : DC モータドライバ基板 (UNO R4 Minima ベース) ×3  r / θ / z
;   svmd : サーボドライバ基板 (UNO R4 Minima ベース)  回転 / 把持
;
; 書き込み例:  pio run -e cwmc -t upload

[platformio]
default_envs = cwmc, dcmd, svmd

[env]
framework = arduino
monitor_speed = 115200

[env:cwmc]
platform = espressif32@6.9.0
board = esp32dev
build_src_filter = +<cwmc/>
board_build.partitions = huge_app.csv
lib_deps =
    arduino-libraries/LiquidCrystal@1.0.7
    https://github.com/rodneybakiskan/ps5-esp32.git#42b9ca971876ee19fce35e30a6dfc4232e077e65

[env:dcmd]
platform = renesas-ra@1.9.0
board = uno_r4_minima
build_src_filter = +<dcmd/>
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3

[env:svmd]
platform = renesas-ra@1.9.0
board = uno_r4_minima
build_src_filter = +<svmd/>
lib_deps =
    arduino-libraries/Servo@1.2.2
